name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The container launcher is a plain bionic executable; it ships inside the APK as
      # libarchbox.so (the only place Android lets an app exec a bundled binary from).
      - name: Build launcher with the NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$CC" -O2 -Wall -fPIE -pie -Wl,-z,max-page-size=16384 \
            -o app/src/main/jniLibs/arm64-v8a/libarchbox.so native/archbox.c
          file app/src/main/jniLibs/arm64-v8a/libarchbox.so
          # turns off heap pointer tagging inside PRoot (see native/notag.c)
          "$CC" -O2 -fPIC -shared -o app/src/main/jniLibs/arm64-v8a/libnotag.so native/notag.c
          file app/src/main/jniLibs/arm64-v8a/libnotag.so

      # Fallback for kernels without user namespaces (like this phone's): PRoot, prebuilt for Android
      # (green-green-avk/build-proot-android, pinned commit + sha256). Shipped as lib*.so because
      # that is the only place Android lets an app exec bundled binaries from.
      - name: Fetch PRoot
        run: |
          set -e
          COMMIT=01f83b8841358450c78333d1b33ab30d4943bec4
          SHA=9629eb30cdf86e95c6ba681f8ab89c6fdaa9eca093d5577163513c99af5ca281
          curl -fsSL -o proot.tgz "https://raw.githubusercontent.com/green-green-avk/build-proot-android/$COMMIT/packages/proot-android-aarch64.tar.gz"
          echo "$SHA  proot.tgz" | sha256sum -c -
          mkdir -p proot-x app/src/main/jniLibs/arm64-v8a
          tar xzf proot.tgz -C proot-x
          J=app/src/main/jniLibs/arm64-v8a
          cp proot-x/root/bin/proot           $J/libproot.so
          cp proot-x/root/bin/proot-userland  $J/libproot-userland.so
          cp proot-x/root/libexec/proot/loader $J/libproot-loader.so
          sudo apt-get install -y -qq patchelf
          for f in libproot.so libproot-userland.so; do
            patchelf --add-needed libnotag.so --set-rpath '$ORIGIN' "$J/$f"
            readelf -d "$J/$f" | grep -E "NEEDED|RUNPATH"
          done
          file $J/libproot*.so

      # Tier 3 fallback (fakechroot): glibc objects, built for aarch64 with the distro cross
      # compiler (NOT the NDK: they run under the Arch rootfs's glibc, not bionic). Shipped as
      # lib*.so so Android extracts them. `faked` must be the TCP flavour: SysV IPC is blocked.
      # Optional: if this step fails the APK still builds and the launcher reports the tier missing.
      - name: Build fakechroot + fakeroot (glibc aarch64)
        continue-on-error: true
        run: |
          set -e
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu autoconf automake libtool make
          J=$PWD/app/src/main/jniLibs/arm64-v8a
          # TODO: pin both tarballs by sha256 like PRoot above (not done yet: could not be fetched when written)
          FC=2.20.1; FR=1.37.1.2
          curl -fsSL -o fc.tgz "https://github.com/dex4er/fakechroot/releases/download/$FC/fakechroot-$FC.tar.gz"
          curl -fsSL -o fr.tgz "https://deb.debian.org/debian/pool/main/f/fakeroot/fakeroot_$FR.orig.tar.gz"
          mkdir fc fr && tar xzf fc.tgz -C fc --strip-components=1 && tar xzf fr.tgz -C fr --strip-components=1
          export CC=aarch64-linux-gnu-gcc
          (cd fc && ./configure --host=aarch64-linux-gnu && make -j"$(nproc)" && cp src/.libs/libfakechroot.so $J/libfakechroot.so)
          (cd fr && ./configure --host=aarch64-linux-gnu --with-ipc=tcp && make -j"$(nproc)" \
             && cp .libs/libfakeroot-tcp.so $J/libfakeroot.so 2>/dev/null || cp .libs/libfakeroot.so $J/libfakeroot.so
             cp faked $J/libfaked.so)
          file $J/libfakechroot.so $J/libfakeroot.so $J/libfaked.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        shell: bash
        run: |
          mkdir -p out
          pip install --quiet pillow
          ICON=app/src/main/res/drawable-nodpi/ic_launcher.png
          { python3 tools/gen_icon.py "$GITHUB_SHA" 28 $ICON && gradle --no-daemon assembleDebug -Ptsdk=28 -Pgitsha=$GITHUB_SHA && cp app/build/outputs/apk/debug/app-debug.apk out/archbox-target28.apk \
            && python3 tools/gen_icon.py "$GITHUB_SHA" 34 $ICON && gradle --no-daemon assembleDebug -Ptsdk=34 -Pgitsha=$GITHUB_SHA && cp app/build/outputs/apk/debug/app-debug.apk out/archbox-target34.apk; } 2>&1 | tee gradle.log

      # (surface the error as an annotation so it is readable through the API too)
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          t = open("gradle.log", errors="replace").read()
          lines = [l for l in t.splitlines() if re.search(r"error|FAILED|wrong|Could not|not found|Unresolved|cannot find|What went", l, re.I)]
          msg = "\n".join(lines[:40]) or t[-3000:]
          msg = msg.replace("%","%25").replace("\r","%0D").replace("\n","%0A")
          print("::error title=gradle::" + msg[:3500])
          PY

      - name: List APK native libs
        if: always()
        run: |
          APK=$(ls out/*.apk | head -1)
          L=$(unzip -l "$APK" | grep -E "lib/|\.dex" | awk '{print $1, $4}' | tr '\n' ';')
          echo "::notice title=apk-contents::$L"

      - name: List APK contents
        if: always()
        run: |
          APK=$(ls out/*.apk | head -1)
          L=$(unzip -l "$APK" | grep -E "lib/|AndroidManifest" | awk '{printf "%s %s%%0A", $1, $4}')
          echo "::notice title=apk-contents::$L"
          unzip -p "$APK" lib/arm64-v8a/libarchbox.so | head -c 4 | od -c | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: archbox-debug-apk
          path: out/*.apk
